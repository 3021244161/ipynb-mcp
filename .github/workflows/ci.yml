name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # No ipykernel here on purpose: this job proves the unit suite passes on a
      # machine WITHOUT Python (AGENTS §3). The cases that need a real kernel
      # probe for one and skip with a recorded reason (review T5).
      - run: pnpm test
      # R15/SPEC §8 rule 1: every green run must also prove the packable
      # artifact builds (review C1 — a publishable-empty-package gap).
      - run: pnpm build

  integration:
    name: integration (${{ matrix.os }}, py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Layered per SPEC §9: macOS does not run integration.
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ipykernel
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Review T5/D2: the unit suite is the only place the symtable analyzer's
      # discriminating power is asserted (analyze-op drives the REAL sidecar),
      # so it must run in a job that has ipykernel. Without this line the D2
      # guardrail held in no job at all.
      - run: pnpm test
        env:
          IPYNB_TEST_PYTHON: python
      # setup-python's interpreter becomes the venv base for the test env.
      - run: pnpm test:integration
        env:
          IPYNB_TEST_PYTHON: python
