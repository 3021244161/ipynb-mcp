name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # macOS runners bill at 10x on GitHub Actions, so it carries only the
        # LTS the package declares. SPEC §9 already layers macOS out of the
        # integration job for the same reason (issue #1 problem 4); if a macOS
        # refactor ever appears, this is where to look first.
        node: [22, 24]
        exclude:
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      # No `version:` input on purpose: package.json declares
      # `packageManager: pnpm@11.7.0`, and action-setup v4 hard-fails with
      # "Multiple versions of pnpm specified" when both are present and unequal
      # -- which stopped every job at the install step (review v3 DEP-6).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # No ipykernel here on purpose: this job proves the unit suite passes on a
      # machine WITHOUT Python (AGENTS §3). The cases that need a real kernel
      # probe for one and skip with a recorded reason (review T5).
      - run: pnpm test
      # R15/SPEC §8 rule 1: every green run must also prove the packable
      # artifact builds (review C1 — a publishable-empty-package gap).
      - run: pnpm build

  integration:
    name: integration (${{ matrix.os }}, py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Layered per SPEC §9: macOS does not run integration.
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      # Same reason as the unit job: the version comes from packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # BOTH modules, explicitly, plus nbformat. `pip install ipykernel` used to be
      # assumed to bring jupyter_client along; it does not always, and the sidecar
      # imports jupyter_client at startup, so the interpreter the tests picked looked
      # "capable" to a probe that only checked ipykernel and then failed inside the
      # sidecar (CI issue #1 problem 2). The module list mirrors
      # SIDECAR_REQUIRED_MODULES in src/kernel/interpreter.ts.
      #
      # `nbformat` is here because it is the EXTERNAL AUTHORITY for "is this file
      # valid nbformat", and neither ipykernel nor jupyter_client depends on it
      # (verified via Requires-Dist). Without it the two [FID-1]/[FID-3]
      # assertions were skipped by a bare `if`, so the only automated environment
      # reported green while never checking validity at all (review v7 P0-a).
      - run: pip install ipykernel jupyter_client nbformat
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # V8-9: the tarball shipped a compiled copy of the sidecar and nothing
      # checked the artifact at all. Asserting its SHAPE here means a stray
      # `__pycache__` or a lost entry point fails the build instead of reaching
      # npm.
      - run: pnpm check:package
      # The smoke test drives a real stdio server through the real SDK. It was
      # "19/19 locally" for three rounds, which is why it is here: a check that
      # only ever ran on one machine is the class of gap CI exists to close.
      - run: pnpm smoke
      # Review T5/D2: the unit suite is the only place the symtable analyzer's
      # discriminating power is asserted (analyze-op drives the REAL sidecar),
      # so it must run in a job that has ipykernel. Without this line the D2
      # guardrail held in no job at all.
      - run: pnpm test
        env:
          IPYNB_TEST_PYTHON: python
      # TST-1: a fallback to a non-venv interpreter means the environment (or
      # our own spawn/path logic) is broken; in CI that must be a failure, not a
      # silently greener suite.
      #
      # IPYNB_REQUIRE_NBFORMAT is the same guard for the external authority: with
      # it set, an environment without nbformat fails instead of skipping the only
      # assertion that checks our output against something we did not write.
      - run: pnpm test:integration
        env:
          IPYNB_TEST_PYTHON: python
          IPYNB_TEST_REQUIRE_VENV: '1'
          IPYNB_REQUIRE_NBFORMAT: '1'
